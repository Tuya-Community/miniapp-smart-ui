name: Publish Beta Package

# 使用 pull_request_target 而非 pull_request：fork 仓库的 PR 在 pull_request 下拿不到 secrets，
# 合并后无法发 beta。此 workflow 必须位于默认分支 main；pull_request_target 运行时
# github.ref 指向 main，因此发布步骤必须显式检出 release/2.x（已审核合入的代码）。
# 注意：禁止在本流程中检出 PR head（head.sha / head.ref），
# 也禁止把 fork 可控的 head.ref / title / body 拼进脚本，否则会把 secrets 暴露给未审核代码。
on:
  pull_request_target:
    branches:
      - 'release/2.x'
    types:
      - closed
  # 兜底：合并后 beta 未发出时，可在 Actions 页面选择 release/2.x 手动补发
  workflow_dispatch:
    inputs:
      pr_number:
        description: '关联的 PR 编号（用于评论与同步 ray-smart-ui）'
        required: true
        type: string

concurrency:
  group: publish-beta-release-2x
  cancel-in-progress: false

jobs:
  publish_beta:
    runs-on: ubuntu-latest
    # 只在 PR 被合并时执行，避免关闭未合并的 PR 也触发；手动补发只允许在 release/2.x 上运行
    if: |
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/2.x')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PROTECT_WRITE_TOKEN }}
          ref: release/2.x

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure Git Identity
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Resolve PR Context
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "❌ Invalid PR number: ${PR_NUMBER}"
            exit 1
          fi
          # fork PR 的分支在主仓库中不存在，手动补发也没有来源分支：统一按 fix/ 分支处理，
          # ray-smart-ui 会基于 release/2.x 直接发 beta（不走 AI 同步）
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$IS_FORK" = "true" ]; then
            RAY_BRANCH="fix/pr-${PR_NUMBER}"
          else
            RAY_BRANCH="$HEAD_REF"
          fi
          echo "PR_NUMBER=${PR_NUMBER}" >> $GITHUB_ENV
          echo "RAY_BRANCH=${RAY_BRANCH}" >> $GITHUB_ENV
          echo "PR: #${PR_NUMBER}, ray-smart-ui branch: ${RAY_BRANCH}"

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: build
        run: yarn build

      - name: Get Package Information
        id: package_info
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_BASE_VERSION=$(node -p "require('./package.json').version" | cut -d '-' -f 1)
          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> $GITHUB_ENV
          echo "PACKAGE_BASE_VERSION=${PACKAGE_BASE_VERSION}" >> $GITHUB_ENV

      - name: Get Latest Beta Version
        id: latest_version
        run: |
          existing_versions=$(npm show $PACKAGE_NAME versions --json | jq -r '.[]' | grep -E "^${PACKAGE_BASE_VERSION}-beta-" || true )
          if [ -z "$existing_versions" ]; then
            echo "LATEST_VERSION=${PACKAGE_BASE_VERSION}" >> $GITHUB_ENV
          else
            latest_version=$(echo "$existing_versions" | sort -V | tail -n 1)
            echo "LATEST_VERSION=${latest_version}" >> $GITHUB_ENV
          fi
      - name: Calculate Next Beta Version
        id: next_version
        run: |
          if [ "$LATEST_VERSION" = "${PACKAGE_BASE_VERSION}" ]; then
            next_version="${PACKAGE_BASE_VERSION}-beta-0"
          else
            beta_number=$(echo "${LATEST_VERSION}" | tr '-' ' ' | awk '{print $NF}')
            next_beta=$((beta_number + 1))
            next_version="${PACKAGE_BASE_VERSION}-beta-${next_beta}"
          fi
          echo "NEXT_VERSION=${next_version}" >> $GITHUB_ENV

      - name: Update Package.json with Next Version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if [ "$CURRENT_VERSION" != "${NEXT_VERSION}" ]; then
            npm version "${NEXT_VERSION}" --no-git-tag-version
          else
            echo "Package version is already ${NEXT_VERSION}, skipping version update"
          fi

      - name: Publish Package
        run: npm publish --access public --tag beta
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit Changes
        run: |
          git config pull.rebase false
          git pull origin release/2.x
          git add package.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(release): ${NEXT_VERSION} release by Github Actions"
            git log -1  # 检查最后的commit结果
          fi

      - name: Push
        # 使用个人访问令牌来推送更改以避免保护分支限制
        run: |
          git push https://x-access-token:${{ secrets.PROTECT_WRITE_TOKEN }}@github.com/${{ github.repository }} HEAD:release/2.x
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on PR
        uses: peter-evans/create-or-update-comment@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ env.PR_NUMBER }}
          repository: ${{ github.repository }}
          body: |
            The merge has been completed successfully. The current npm version is `${{ env.NEXT_VERSION }}`.

      - name: Wait for npm registry availability
        run: |
          for attempt in {1..60}; do
            available_version=$(npm view "${PACKAGE_NAME}@${NEXT_VERSION}" version --registry=https://registry.npmjs.org/ --prefer-online 2>/dev/null || true)
            if [ "$available_version" = "$NEXT_VERSION" ]; then
              echo "${PACKAGE_NAME}@${NEXT_VERSION} is available in npm registry"
              exit 0
            fi
            echo "Waiting for npm registry to expose ${PACKAGE_NAME}@${NEXT_VERSION} (${attempt}/60)"
            sleep 10
          done
          echo "::error::${PACKAGE_NAME}@${NEXT_VERSION} is still unavailable after 10 minutes"
          exit 1

      - name: Call Publish Manual Workflow
        id: trigger_workflow
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: publish-manual.yml
          repo: Tuya-Community/ray-smart-ui
          token: ${{ secrets.PROTECT_WRITE_TOKEN }}
          ref: release/2.x
          inputs: |
            {
              "version": "${{ env.NEXT_VERSION }}",
              "branch": "${{ env.RAY_BRANCH }}",
              "mr_id":"${{ env.PR_NUMBER }}"
            }

      - name: Wait for Workflow Completion
        if: startsWith(env.RAY_BRANCH, 'fix/')
        id: wait_workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROTECT_WRITE_TOKEN }}
          script: |
            const targetOwner = 'Tuya-Community';
            const targetRepo = 'ray-smart-ui';
            const workflowName = 'publish-manual.yml';
            const maxWaitTime = 30 * 60 * 1000; // 30 分钟超时
            const pollInterval = 10 * 1000; // 每 10 秒检查一次
            const startTime = Date.now();

            console.log('⏳ Waiting for workflow to complete...');

            // 使用工作流文件名作为 ID（GitHub API 支持文件名或数字 ID）
            const workflowId = workflowName;
            console.log(`📋 Using workflow: ${workflowId}`);

            // 等待一小段时间，让工作流开始运行
            await new Promise(resolve => setTimeout(resolve, 5000));

            // 轮询检查工作流状态
            let runId = null;
            let attempts = 0;
            const maxAttempts = 10;

            // 首先找到最新触发的工作流运行
            while (!runId && attempts < maxAttempts) {
              try {
                const runs = await github.rest.actions.listWorkflowRuns({
                  owner: targetOwner,
                  repo: targetRepo,
                  workflow_id: workflowId,
                  per_page: 1,
                });
                
                if (runs.data.workflow_runs.length > 0) {
                  const latestRun = runs.data.workflow_runs[0];
                  // 检查是否是最近 2 分钟内触发的（避免匹配到旧运行）
                  const runTime = new Date(latestRun.created_at).getTime();
                  const timeDiff = Date.now() - runTime;
                  
                  if (timeDiff < 2 * 60 * 1000) {
                    runId = latestRun.id;
                    console.log(`✅ Found workflow run ID: ${runId}`);
                    console.log(`   Status: ${latestRun.status}, Conclusion: ${latestRun.conclusion || 'pending'}`);
                  }
                }
              } catch (error) {
                console.log(`⚠️  Error finding workflow run (attempt ${attempts + 1}): ${error.message}`);
              }
              
              if (!runId) {
                attempts++;
                await new Promise(resolve => setTimeout(resolve, 3000));
              }
            }

            if (!runId) {
              throw new Error('Could not find the triggered workflow run');
            }

            // 轮询等待工作流完成
            while (true) {
              const elapsed = Date.now() - startTime;
              if (elapsed > maxWaitTime) {
                throw new Error(`Workflow did not complete within ${maxWaitTime / 1000 / 60} minutes`);
              }
              
              try {
                const run = await github.rest.actions.getWorkflowRun({
                  owner: targetOwner,
                  repo: targetRepo,
                  run_id: runId,
                });
                
                const status = run.data.status;
                const conclusion = run.data.conclusion;
                
                console.log(`📊 Workflow status: ${status}, Conclusion: ${conclusion || 'pending'}`);
                
                // 检查是否完成
                if (status === 'completed') {
                  const runUrl = run.data.html_url;
                  console.log(`✅ Workflow completed!`);
                  console.log(`🔗 Run URL: ${runUrl}`);
                  
                  if (conclusion === 'success') {
                    console.log('✅ Workflow completed successfully');
                    return;
                  } else {
                    throw new Error(`Workflow completed with conclusion: ${conclusion}. Check ${runUrl} for details.`);
                  }
                }
                
                // 如果还在运行，等待后继续检查
                await new Promise(resolve => setTimeout(resolve, pollInterval));
              } catch (error) {
                if (error.message.includes('completed')) {
                  throw error;
                }
                console.log(`⚠️  Error checking workflow status: ${error.message}`);
                await new Promise(resolve => setTimeout(resolve, pollInterval));
              }
            }

      - name: Comment on PR - Publish Success
        if: startsWith(env.RAY_BRANCH, 'fix/') && steps.wait_workflow.outcome == 'success'
        uses: peter-evans/create-or-update-comment@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ env.PR_NUMBER }}
          repository: ${{ github.repository }}
          body: |
            Publishing @ray-js/smart-ui has been completed successfully. The current npm version is `${{ env.NEXT_VERSION }}`.
